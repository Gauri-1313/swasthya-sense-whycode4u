# ==============================================================================
# Swasthya Sense - Application Configuration
# ==============================================================================
spring.application.name=swasthya-sense-backend
server.port=8080

# ------------------------------------------------------------------------------
# MySQL Database Configuration
# ------------------------------------------------------------------------------
# Auto-creates database 'swasthya_sense' if it does not already exist
spring.datasource.url=jdbc:mysql://localhost:3306/swasthya_sense?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# Spring Data JPA & Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Logging & CORS Configuration
# ------------------------------------------------------------------------------
logging.level.com.swasthya.sense=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

